<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGE GAME - Prepare to Suffer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        #gameContainer {
            width: 800px;
            height: 600px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 4px solid #ff0000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
        }

        #levelInfo {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            max-width: 400px;
            z-index: 100;
        }

        #hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 16px;
            background: rgba(255, 200, 0, 0.9);
            color: #000;
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            text-align: center;
            font-weight: bold;
            z-index: 100;
            border: 2px solid #ff0000;
        }

        .hidden {
            display: none !important;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 48px;
            text-align: center;
            color: #ff0000;
        }

        .game-over-text {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .restart-btn {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 24px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .restart-btn:hover {
            background: #ff3333;
        }

        #deathCount {
            margin-top: 20px;
            font-size: 32px;
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <div id="ui">
            <span id="deathCounter">Deaths: 0</span>
        </div>

        <div id="levelInfo">
            <span id="level">Level: 1</span>
        </div>

        <div id="instructions">
            <span id="instructionText">Controls: Arrow Keys to Move, Space to Jump</span>
        </div>

        <div id="hint">
            <span id="hintText">HINT: Try something weird...</span>
        </div>

        <div id="gameOverScreen" class="hidden">
            <div class="game-over-text">🎉 LEVEL COMPLETE! 🎉</div>
            <div id="deathCount"></div>
            <button class="restart-btn" onclick="game.nextLevel()">NEXT LEVEL</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
